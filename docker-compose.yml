services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs
      PORT: 8080
      RETENTION_DAYS: 30
      RETENTION_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    command: >
      postgres -c jit=off -c synchronous_commit=off -c fsync=off -c max_wal_senders=0 -c wal_level=minimal -c shared_buffers=256MB -c effective_cache_size=768MB -c wal_buffers=16MB -c work_mem=32MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.95 -c checkpoint_timeout=30min -c min_wal_size=64MB -c max_wal_size=1GB -c max_connections=60 -c random_page_cost=1.1 -c seq_page_cost=1.0 -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0 -c autovacuum=on -c autovacuum_naptime=15s -c autovacuum_vacuum_scale_factor=0.1 -c autovacuum_vacuum_insert_scale_factor=0.2 -c autovacuum_vacuum_cost_limit=200 -c autovacuum_vacuum_cost_delay=20ms -c autovacuum_analyze_scale_factor=0.05 -c bgwriter_delay=20ms -c bgwriter_lru_maxpages=800 -c bgwriter_lru_multiplier=3.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d logs" ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data:
