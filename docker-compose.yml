services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-service-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/logs
      PORT: 8080
      RETENTION_DAYS: 30
      RETENTION_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: log-service-postgres
    shm_size: 256mb
    command: >
      postgres -c synchronous_commit=off -c shared_buffers=256MB -c wal_buffers=16MB -c work_mem=16MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c max_wal_size=2GB -c max_connections=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d logs" ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data:
